[project]
name = "usaciv-etl"
version = "0.1.0"
description = "Real-data ETL pipeline for Terra Americana (31 public U.S. datasets -> 25km hex grid)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.2.0",
    "geopandas>=1.0.1",
    "httpx>=0.28.1",
    "numpy>=2.1.0",
    "openpyxl>=3.1.5",
    "polars>=1.20.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.10.0",
    "pyproj>=3.7.0",
    "pyyaml>=6.0.2",
    "rasterio>=1.4.3",
    "scipy>=1.14.0",
    "shapely>=2.0.6",
    "tqdm>=4.67.1",
    "xlrd>=2.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usaciv_etl"]
